$kind: http-request
url: "{{baseUrl}}/api/ideas/generate"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "message": "   ",
      "history": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Error claro', () => pm.expect(pm.response.json().error).to.be.a('string').and.not.empty);
    language: text/javascript
order: 3000
